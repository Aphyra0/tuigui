[workspace]
resolver = "2"
members = ["crates/easytgp", "crates/tuigui-wire", "crates/tui", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
derive_builder = "0.20"
clap = { version = "4", features = ["derive", "env"] }
rustix = { version = "1.1", features = ["fs", "termios", "process", "pty", "net"] }
png = "0.18"
image = "0.25"
fast_image_resize = { version = "6", features = ["rayon"] }
base64-turbo = "0.5"
itertools = "0.15"
idalloc = "0.1"
static_init = "1.0"
yscv-video = "0.2"
# Its default feature is the ffmpeg *downloader*, which drags in ureq ->
# rustls -> ring: a full TLS stack and a C build that this project never uses,
# since ffmpeg comes from the dev shell's PATH. Disabled, so the crate is just
# the subprocess plumbing we actually call.
ffmpeg-sidecar = { version = "2", default-features = false }
rstar = "0.13"
rayon = "1"
ndarray = "0.16"
ratatui = "0.30"
pollster = "0.4"
fxhash = "0.2"
crossterm = { version = "0.28", default-features = false }
derive_deref = "1.1"
derive-getters = "0.5"
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "renderer_pixman", "desktop", "xwayland"] }
wayland-protocols = { version = "0.32", features = ["client"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "process", "sync", "time", "macros"] }

# internal
easytgp = { path = "crates/easytgp" }
tuigui-wire = { path = "crates/tuigui-wire" }
tui = { path = "crates/tui" }
gui = { path = "crates/gui" }

[package]
name = "tuigui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Run the tui server and a gui client as a single unit"

[[bin]]
name = "tuigui"
path = "src/main.rs"

[dependencies]
tui = { workspace = true }
gui = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
