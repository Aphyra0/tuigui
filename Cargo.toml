[workspace]
resolver = "2"
members = [
    "crates/gobo-core",
    "crates/gobo-comp",
    "crates/gobo-widget",
    "crates/easytgp",
    "crates/gobo-tgp-renderer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
derive_builder = "0.20"
rustix = { version = "1.1", features = ["fs", "termios", "process"] }
png = "0.18"
image = "0.25"
base64-turbo = "0.5"
itertools = "0.15"
idalloc = "0.1"
static_init = "1.0"
crossterm = { version = "0.28", default-features = false }

# internal
gobo-core = { path = "crates/gobo-core" }
gobo-comp = { path = "crates/gobo-comp" }
gobo-widget = { path = "crates/gobo-widget" }
easytgp = { path = "crates/easytgp" }
gobo-tgp-renderer = { path = "crates/gobo-tgp-renderer" }

[package]
name = "gobo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI app in the terminal"

[[bin]]
name = "gobo"
path = "src/main.rs"

[dependencies]
gobo-core = { workspace = true }
gobo-comp = { workspace = true }
gobo-widget = { workspace = true }
easytgp = { workspace = true }
gobo-tgp-renderer = { workspace = true }