[package]
name = "gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client side: draw a runnable's output into the pane the tui server owns"

[dependencies]
wire = { workspace = true }
easytgp = { workspace = true }
ratatui = { workspace = true }
# Reading this terminal's size in pixels, for the compositor's output.
crossterm = { workspace = true }
# The compositor an app runs inside, and the capture of the window it draws there.
compositor = { workspace = true }
# The terminal's input, as events, with keys mapped to the codes the compositor's
# seat takes.
termputs = { workspace = true }
# SIMD JPEG encoding. `image`'s encoder is scalar and was the single largest
# cost in the frame budget; this one is libjpeg-turbo. `image` is no longer a
# dependency here: frames go from ffmpeg's RGB buffer straight into the encoder.
#
# Linked against the system libjpeg-turbo rather than building it from source:
# Nix's build is already SIMD-optimized, and the pkg-config route needs neither
# cmake nor nasm. `require-simd` makes a scalar fallback a build error instead of
# a silent return to the slow encoder this exists to avoid.
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config", "require-simd"] }
ffmpeg-sidecar = { workspace = true }
rustix = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
# `poll!`, for the two steps that must not block: the dial and the program's start have
# to let their frame finish before anything they drew can reach the terminal.
futures = "0.3"
# The logging facade. Every diagnostic goes through it rather than to the pane, and the
# capturer in this crate is the one logger installed.
log = { workspace = true }

[[bin]]
name = "gui"
path = "src/bin/gui.rs"
