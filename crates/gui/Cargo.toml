[package]
name = "gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client side: draw a runnable's output into the pane the tui server owns"

[dependencies]
wire = { workspace = true }
easytgp = { workspace = true }
# `unstable-widget-ref`: a window draws itself through a shared reference, so
# a window is a `WidgetRef` rather than a `Widget` consumed by the draw.
ratatui = { workspace = true, features = ["unstable-widget-ref"] }
# Reading this terminal's size in pixels, for the session's output.
crossterm = { workspace = true }
# The headless Wayland session an app runs inside, and the capture of the
# window it draws there.
wayland = { workspace = true }
# The terminal's input parser: raw bytes from the pane go in, typed events
# (keys, mouse, protocol responses) come out.
termina = { workspace = true }
# What an event becomes for a window: W3C UI Events as data. `dpi` is the
# coordinate type those events are expressed in — physical pixels, as f64.
ui-events = { workspace = true }
dpi = "0.1"
# The capybara demo image, converted to ANSI art cells (halftone).
halftone = { version = "0.10", default-features = false }
# The codec the client encodes with, behind the trait a codec can be swapped
# behind. Which codec it is, is announced on the wire, not assumed here.
codecs = { workspace = true }
ffmpeg-sidecar = { workspace = true }
rustix = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
# `poll!`, for the two steps that must not block: the dial and the program's start have
# to let their frame finish before anything they drew can reach the terminal.
futures = "0.3"
# The logging facade. Every diagnostic goes through it rather than to the pane, and the
# capturer in this crate is the one logger installed.
log = { workspace = true }
# Spans become zones in the Tracy profiler, for seeing where a frame's time goes.
tracing = { workspace = true }
# The profiler's client, optional and off by default: it is a compiled C++
# library with a background thread, and it is only worth carrying when a session
# is being profiled. `just trace` is what turns it on. `tracing` itself stays
# unconditional — a span with no subscriber is a no-op, so the instrumented code
# is the same code either way and a `tracy` build sees what actually runs.
tracing-tracy = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
default = []
tracy = ["dep:tracing-tracy", "dep:tracing-subscriber"]

[[bin]]
name = "gui"
path = "src/bin/gui.rs"
