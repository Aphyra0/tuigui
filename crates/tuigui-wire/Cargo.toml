[package]
name = "tuigui-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wire protocol and session file shared by the tui server and the gui client"

[dependencies]
# `rt` is only for the tests: `async_read_matches_sync_write` drives the async
# decoder to prove it agrees with the sync one, and needs a runtime to do it.
tokio = { version = "1", features = ["io-util", "rt"] }
