[package]
name = "wayland"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The headless Wayland session an app runs in, owned and driven inline"

[[bin]]
name = "wayland-smoke"
path = "src/bin/wayland-smoke.rs"

[target.'cfg(target_os = "linux")'.dependencies]
wire = { workspace = true }
smithay = { workspace = true }
# The input vocabulary, and the table that turns a physical key into this
# platform's own number. `ui-events` is W3C UI Events as data — keyboard and
# pointer in separate modules, which is the split this crate's queue keeps.
ui-events = { workspace = true }
keycode = { workspace = true }
ratatui = { workspace = true }
wayland-protocols = { workspace = true }
tracing = { workspace = true }
# Diagnostics through the `log` facade, like the rest of the workspace: the binary
# installs a `log` capturer, so a message written through `tracing` reaches the log
# file only when a tracing subscriber is also installed, and the profiler build
# installs one that keeps events to itself.
log = { workspace = true }
thiserror = { workspace = true }
derive-getters = { workspace = true }
derive_setters = { workspace = true }
sysinfo = { workspace = true }
libc = "0.2"
# Used by the smoke client in src/bin, which exercises the session
# end-to-end (it is a real Wayland client).
wayland-client = "0.31"
rustix = { workspace = true }
memmap2 = "0.9"
