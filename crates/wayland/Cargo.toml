[package]
name = "wayland"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The headless Wayland session an app runs in, owned and driven inline"

[[bin]]
name = "wayland-smoke"
path = "src/bin/wayland-smoke.rs"

[target.'cfg(target_os = "linux")'.dependencies]
proto = { workspace = true }
smithay = { workspace = true }
wayland-protocols = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
derive-getters = { workspace = true }
derive_setters = { workspace = true }
sysinfo = { workspace = true }
libc = "0.2"
# Used by the smoke client in src/bin, which exercises the session
# end-to-end (it is a real Wayland client).
wayland-client = "0.31"
rustix = { workspace = true }
memmap2 = "0.9"

# The example writes what it captured as a PNG, so a window can be looked at
# rather than only measured.
[target.'cfg(target_os = "linux")'.dev-dependencies]
png = { workspace = true }
