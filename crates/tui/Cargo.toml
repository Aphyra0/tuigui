[package]
name = "tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Server side: run a command in a pty and paint remotely-sent frames onto the real terminal"

[dependencies]
wire = { workspace = true }
easytgp = { workspace = true }
image = { workspace = true }
rustix = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
# `select_all` and `StreamExt`, for reading every attached client in one loop
# without spawning a task per client. Not already reachable through tokio.
futures-util = { version = "0.3", features = ["alloc"] }

[[bin]]
name = "tui"
path = "src/bin/tui.rs"
