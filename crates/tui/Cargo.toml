[package]
name = "tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Server side: run a command in a pty and paint remotely-sent frames onto the real terminal"

[dependencies]
wire = { workspace = true }
easytgp = { workspace = true }
image = { workspace = true }
rustix = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
# The cursor move a real placement needs, as the bytes a terminal expects rather than a
# sequence spelled out here.
crossterm = { workspace = true }
# Decoding a frame off the wire. The client encodes with the same library, so the
# two halves agree on the codec by sharing it rather than by documenting one.
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config", "require-simd"] }
# `select_all` and `StreamExt`, for reading every attached client in one loop
# without spawning a task per client. Not already reachable through tokio.
futures-util = { version = "0.3", features = ["alloc"] }

[[bin]]
name = "tui"
path = "src/bin/tui.rs"
