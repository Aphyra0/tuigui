[package]
name = "tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Server side: run a command in a pty and paint remotely-sent frames onto the real terminal"

[dependencies]
wire = { workspace = true }
# The stream rewrite: cells of a registered surface are blanked on their way to the
# terminal, so the image behind them is visible.
cell_map = { workspace = true }
# The screen the command is drawing into. Shared between the proxy that feeds it
# and the server that reads it, so there is one answer to "what is on screen".
vt100 = { workspace = true }
easytgp = { workspace = true }
image = { workspace = true }
rustix = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
# Retry, for reporting a failure to the client.
futures-retry = { workspace = true }
# One error type per failure instead of a string in an `io::Error`, so a caller can tell
# a dropped frame from a failed transmit.
thiserror = { workspace = true }
# The cursor move a real placement needs, as the bytes a terminal expects rather than a
# sequence spelled out here.
crossterm = { workspace = true }
# The codec the server decodes with, behind the trait a codec can be swapped
# behind. Which codec it is arrives on the wire, and is not assumed here.
codecs = { workspace = true }
# `select_all` and `StreamExt`, for reading every attached client in one loop
# without spawning a task per client. Not already reachable through tokio.
futures-util = { version = "0.3", features = ["alloc"] }
# Spans become zones in the Tracy profiler, for seeing where a frame's time goes.
tracing = { workspace = true }
# The profiler's client, optional and off by default: it is a compiled C++
# library with a background thread, and it is only worth carrying when a session
# is being profiled. `just trace` is what turns it on. `tracing` itself stays
# unconditional — a span with no subscriber is a no-op, so the instrumented code
# is the same code either way and a `tracy` build sees what actually runs.
tracing-tracy = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
default = []
tracy = ["dep:tracing-tracy", "dep:tracing-subscriber"]

[[bin]]
name = "tui"
path = "src/bin/tui.rs"
