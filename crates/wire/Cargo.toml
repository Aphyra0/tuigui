[package]
name = "wire"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wire protocol, transport abstraction and session file shared by the tui server and the gui client"

[dependencies]
# `io-util` for the async framing and the transports; `net` for the unix socket;
# `rt` and `macros` for the tests that drive it.
tokio = { version = "1", features = ["io-util", "net", "rt", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64-turbo = { workspace = true }
# For the session id a transport shows its peer. One syscall per session, not in
# any loop: this is here rather than behind a uuid crate because all that is
# wanted is eight random hex characters.
getrandom = "0.4"
