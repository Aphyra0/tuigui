[package]
name = "easytgp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal graphics protocol (TGP) wire format encoder/decoder"

[dependencies]
gobo-core = { workspace = true }
derive_builder = { workspace = true }
rustix = { workspace = true }
png = { workspace = true }
image = { workspace = true }
base64-turbo = { workspace = true }
itertools = { workspace = true }
idalloc = { workspace = true }
static_init = { workspace = true }
crossterm = { workspace = true }
derive_deref = { workspace = true }
derive-getters = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ffmpeg-sidecar = { workspace = true }

[[example]]
name = "image"
path = "examples/image.rs"

[[example]]
name = "marker_bench"
path = "examples/marker_bench.rs"